# Eclipse Mosquitto for the local example.
#
# This broker allows anonymous connections and no TLS. That is a deliberate choice for a
# throwaway stack on a developer's machine, and it is exactly what you must not do in
# production: there, give the MCP server its own account, restricted to the topics it is
# meant to read, over TLS. See ../../configs/ for configurations that do.
listener 1883
allow_anonymous true

# Nothing survives `docker compose down`: an example should start the same way every time.
persistence false

log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages true
