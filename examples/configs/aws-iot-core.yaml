# AWS IoT Core.
#
# IoT Core authenticates with a client certificate — there is no username or password — and
# its policies are attached to the certificate, not to this file. Whatever you write here, the
# IoT policy decides what can actually be subscribed to, so give the certificate a policy that
# allows "iot:Subscribe" and "iot:Receive" on the topic filters below and nothing else.
version: 1

brokers:
  aws-iot:
    # The account's ATS endpoint:
    #   aws iot describe-endpoint --endpoint-type iot:Data-ATS
    url: mqtts://a1b2c3d4e5f6g7-ats.iot.eu-west-1.amazonaws.com:8883

    # IoT Core disconnects the older session when a client id is reused, which on a plant
    # network means disconnecting a device. A fixed id is therefore opt-in; prefer a prefix
    # and let the server add a random suffix.
    clientId:
      prefix: mqtt-observer

    tls:
      ca:
        file: ./certs/AmazonRootCA1.pem
      cert:
        file: ./certs/device.pem.crt
      key:
        file: ./certs/private.pem.key
      # Port 443 instead of 8883 needs this ALPN protocol; on 8883 leave it out.
      # alpn: ['x-amzn-mqtt-ca']

    timeouts:
      # IoT Core expects a keepalive of 30 to 1200 seconds.
      keepaliveSeconds: 60

    discovery:
      filters:
        - factory/#
      # IoT Core publishes its own reserved topics under "$aws/", which "#" never matches.
      includeSysTopics: false

    security:
      read:
        allow:
          - factory/#
        deny:
          - factory/+/+/credentials/#

logging:
  level: info
  format: json
