name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (build, typecheck, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Supported Node.js LTS lines only (ADR-0001). 26 becomes the active LTS on
        # 2026-10-28 and is promoted here a few days early, on purpose: the first release
        # goes out before that date and should not advertise less than it supports. The
        # deviation makes this gate stricter rather than looser, and it expires by itself.
        # 24 and 22 are in maintenance. Remove 22 at its end of life (2027-04-30), then 24
        # (2028-04-30).
        node: [22, 24, 26]
        exclude:
          # macOS runners are the scarcest, and one that is never allocated fails the
          # aggregate for reasons that have nothing to do with the code — it happened on
          # main on 2026-10-21. What macOS proves is that the code runs on macOS; which
          # Node line it runs on is proved three times over on Linux and Windows. So macOS
          # keeps the active LTS only.
          - os: macos-latest
            node: 22
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  integration:
    # Talks to a real Eclipse Mosquitto through Testcontainers, and starts the published
    # example stack with Docker Compose, so Docker is required. The example is verified the
    # way a reader runs it: compose up, then check, then an MCP session.
    name: Integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  ci-success:
    # Single stable status for branch protection: the blocking jobs above must all succeed.
    # Required status check in .github/rulesets/main.json; the experimental job is excluded
    # on purpose.
    name: CI success
    runs-on: ubuntu-latest
    needs: [quality, test, integration]
    if: always()
    steps:
      - name: Check blocking jobs
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          [ "${{ needs.quality.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.integration.result }}" = "success" ]

  # There is no experimental job at present, and that is not an oversight.
  #
  # It watched the current, not-yet-LTS line for early warnings (ADR-0001). Node moved to one
  # major release a year from version 27: its alpha opens on 2026-10-28, it ships in April
  # 2027 and enters LTS in October 2027. Until it ships there is no current line to watch, so
  # the job comes back in April 2027 pointing at 27.
