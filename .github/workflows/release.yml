name: Release

# Manual on purpose. Nothing about this repository should be able to publish to npm because
# somebody merged a pull request: a release is a decision, and it is taken here, by a person.
#
#   version → collects the changesets, bumps the versions, writes the changelogs, opens a PR
#   publish → builds, checks, and publishes what is on main, with provenance
#
# Run "version" first, merge the pull request it opens, then run "publish" on main.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options: [version, publish]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version (open the release pull request)
    if: inputs.action == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Check that there is something to release
        run: |
          if [ -z "$(find .changeset -name '*.md' -not -name 'README.md' -print -quit)" ]; then
            echo "No changesets: nothing to release." >&2
            exit 1
          fi

      - name: Bump versions and write the changelogs
        # The changelog generator is @changesets/changelog-github: it asks the GitHub API which
        # pull request and which author each changeset came from, so it needs a token and
        # fails outright without one. Nothing in this step pushes anything.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run version

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/mcp-server/package.json').version")"
          branch="release/v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -s -m "chore(release): v${version}"
          git push --force-with-lease -u origin "$branch"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "chore(release): v${version}" \
            --body "Versions bumped and changelogs written by \`changeset version\`. Merge this, then run the Release workflow again with \`publish\`."

  publish:
    name: Publish to npm
    if: inputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The whole of the publishing credential. npm exchanges this job's OIDC identity for a
      # short-lived token and verifies the provenance attestation against it. Remove it and
      # the release cannot authenticate at all.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Refuse to publish a package still marked private
        # The catch is off (ADR-0002), and this is the tripwire that says so: npm treats a
        # private package as nothing to publish and exits successfully, so without this a
        # release that published nothing at all would look exactly like one that worked.
        run: |
          set -euo pipefail
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./$manifest').private === true")" = "true" ]; then
              echo "$manifest is marked \"private\": true. Set it to false to publish." >&2
              exit 1
            fi
          done

      - name: Refuse to publish provenance from a private repository
        # npm verifies the attestation against the source repository and rejects one that
        # points at a private repo — with a 422, after the tarball has been uploaded. That is
        # a release that failed halfway rather than one that was refused, so it is worth one
        # API call to get the same answer before anything leaves the runner.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wants_provenance=false
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./$manifest').publishConfig?.provenance === true")" = "true" ]; then
              wants_provenance=true
            fi
          done
          if [ "$wants_provenance" = "false" ]; then
            echo "No package requests provenance: repository visibility does not matter." >&2
            exit 0
          fi
          if [ "$(gh repo view --json isPrivate --jq .isPrivate)" = "true" ]; then
            echo "This repository is private and the packages request npm provenance." >&2
            echo "Make it public, or set publishConfig.provenance to false in both packages." >&2
            exit 1
          fi

      - name: Refuse to publish an unreleased version
        run: |
          set -euo pipefail
          if [ -n "$(find .changeset -name '*.md' -not -name 'README.md' -print -quit)" ]; then
            echo "Changesets are still pending: run the workflow with \"version\" first." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - name: Integration tests
        run: npm run test:integration

      - name: Check that npm is new enough to authenticate without a token
        # Trusted publishing exchanges the job's OIDC identity for a short-lived token, and
        # npm only knows how to do that from 11.5.1. An older npm does not fall back — it
        # looks for a credential it will not find. The supported Node lines are not equal
        # here: 26 ships npm 11.20, 24 ships 11.19, and 22 ships 10.9.
        run: |
          set -euo pipefail
          required=11.5.1
          actual="$(npm --version)"
          echo "npm $actual (trusted publishing needs $required)"
          [ "$( { echo "$required"; echo "$actual"; } | sort -V | head -1)" = "$required" ]

      - name: Publish
        # No credential. The registry trusts this repository and this workflow file through
        # OIDC, configured per package on npmjs.com, and both packages refuse a token-based
        # publish outright. Provenance is requested per package through publishConfig and
        # comes from the same identity, so the attestation is produced whichever way publish
        # is invoked.
        run: npm run release

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An annotated tag records who made it, and a runner has no identity of its own.
          # Without this `git tag -a` fails with "empty ident name" — after the packages have
          # been published, which is the worst place in this job to stop.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(node -p "require('./packages/mcp-server/package.json').version")"
          # Only this version's section of the changelog, not the whole history.
          awk -v heading="## ${version}" '
            $0 == heading { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' packages/mcp-server/CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          git tag -a "v${version}" -m "v${version}"
          git push origin "v${version}"
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag
